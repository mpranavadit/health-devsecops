
# Local Minikube deployment.
# Jenkins replaces health-api:local with the image built for each pipeline run.
#
# SQLite uses a ReadWriteOnce PVC, so retain one replica and Recreate strategy.
# For production high availability, migrate to PostgreSQL.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: health-api
  namespace: health-test

  labels:
    app: health-api

  annotations:
    checkov.io/skip1: "CKV2_K8S_6=Local Minikube kindnet has no confirmed NetworkPolicy enforcement; enable a policy-enforcing CNI before production deployment"
    checkov.io/skip2: "CKV_K8S_15=Local Minikube uses preloaded images with IfNotPresent; use Always for registry-backed production deployment"
    checkov.io/skip3: "CKV_K8S_43=Local Minikube uses preloaded per-build tags; pin a registry manifest digest before production deployment"

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: health-api

  template:
    metadata:
      labels:
        app: health-api

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: health-api:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: DB_PATH
              value: /data/health.db

            - name: JWT_SECRET_FILE
              value: /run/secrets/JWT_SECRET

            - name: FIELD_ENCRYPTION_KEY_FILE
              value: /run/secrets/FIELD_ENCRYPTION_KEY

            - name: SEED_PASSWORD_FILE
              value: /run/secrets/SEED_PASSWORD

          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true

            - name: data
              mountPath: /data

            - name: tmp
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: secrets
          secret:
            secretName: app-secrets

        - name: data
          persistentVolumeClaim:
            claimName: health-data

        - name: tmp
          emptyDir: {}
